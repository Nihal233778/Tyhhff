<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Arena</title>
    
    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 2. CleanAds SDK -->
    <script src="https://api.cleanads.ai/sdk/v1.js"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }

        .dragon-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 { font-size: 26px; margin-bottom: 5px; font-weight: 800; }
        p { font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 20px; }

        .stats-container {
            background-color: var(--secondary-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 300px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 300px;
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:active { transform: scale(0.95); }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .ad-btn { background-color: #f39c12; } /* Orange color for ads */
        .ad-btn-secondary { background-color: #8e44ad; } /* Purple for the second ad */
        
        #loading {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #f39c12;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="dragon-icon">🐉</div>
    <h1>Dragon Arena</h1>
    <p>Welcome, <span id="username">Warrior</span>!</p>

    <div class="stats-container">
        <div class="stat-row">
            <span>Your Power:</span>
            <span id="power-level">0</span>
        </div>
        <div class="stat-row">
            <span>Boss HP:</span>
            <span id="boss-hp">100</span>
        </div>
    </div>

    <div class="btn-group">
        <button id="attack-btn">⚔️ Attack Boss</button>
        
        <!-- REWARDED AD BUTTON -->
        <button id="rewarded-btn" class="ad-btn">🎁 Watch Ad for +50 Power</button>
        
        <!-- INTERSTITIAL AD BUTTON -->
        <button id="interstitial-btn" class="ad-btn-secondary">📺 Watch Ad to Instant Kill</button>
    </div>

    <div id="loading">Loading Ad...</div>

    <script>
        // ==========================================
        // 1. TELEGRAM INITIALIZATION
        // ==========================================
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const user = tg.initDataUnsafe?.user;
        // Fallback for testing outside Telegram
        const currentUser = {
            id: user ? user.id.toString() : "test_user_123", 
            firstName: user ? user.first_name : "Warrior"
        };
        
        document.getElementById('username').innerText = currentUser.firstName;

        // ==========================================
        // 2. CLEAN ADS INITIALIZATION
        // ==========================================
        // Note: I renamed your variables to prevent "Identifier 'ad' has already been declared" errors.

        // Interstitial 1 (For Instant Kill)
        const interstitialAd1 = CleanAds.init({
            placementId: "pl_cvDxWjCGVdVb",
            userId: currentUser.id,
            test: false, 
        });

        // Rewarded Ad (For Power)
        const rewardedAd = CleanAds.init({
            placementId: "pl_JyX3t7-wV2gp",
            userId: currentUser.id,
            test: false,
        });

        // Interstitial 2 (Backup/Alternative)
        const interstitialAd2 = CleanAds.init({
            placementId: "pl_jouilwd7OWTY",
            userId: currentUser.id,
            test: false,
        });

        // ==========================================
        // 3. GAME LOGIC
        // ==========================================
        let playerPower = 0;
        let bossHp = 100;
        
        const attackBtn = document.getElementById('attack-btn');
        const rewardedBtn = document.getElementById('rewarded-btn');
        const interstitialBtn = document.getElementById('interstitial-btn');
        const powerEl = document.getElementById('power-level');
        const bossHpEl = document.getElementById('boss-hp');
        const loadingEl = document.getElementById('loading');

        function updateUI() {
            powerEl.innerText = playerPower;
            if (bossHp > 0) {
                bossHpEl.innerText = bossHp;
            }
        }

        function resetBoss() {
            bossHp = 100;
            bossHpEl.innerText = bossHp;
            attackBtn.disabled = false;
            attackBtn.innerText = "⚔️ Attack Boss";
        }

        // --- Normal Attack ---
        attackBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            const damage = Math.floor(Math.random() * 11) + 5;
            playerPower += damage;
            bossHp -= damage;

            if (bossHp <= 0) {
                bossHpEl.innerText = "DEFEATED!";
                attackBtn.disabled = true;
                attackBtn.innerText = "Respawning...";
                setTimeout(resetBoss, 3000);
            }
            updateUI();
        });

        // --- REWARDED AD LOGIC ---
        rewardedBtn.addEventListener('click', async () => {
            rewardedBtn.disabled = true;
            loadingEl.style.display = 'block';
            loadingEl.innerText = "Loading Reward Ad...";

            try {
                await rewardedAd.show(); // Triggers the ad
                
                // If we get here, the user watched the full ad
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                
                // Grant Reward
                playerPower += 50;
                updateUI();
                tg.showAlert("Reward Granted: +50 Power!");
                
            } catch (e) {
                console.log("No ad:", e.reason);
                tg.showAlert("Ad could not be shown: " + e.reason);
            } finally {
                rewardedBtn.disabled = false;
                loadingEl.style.display = 'none';
            }
        });

        // --- INTERSTITIAL AD LOGIC ---
        interstitialBtn.addEventListener('click', async () => {
            interstitialBtn.disabled = true;
            loadingEl.style.display = 'block';
            loadingEl.innerText = "Loading Interstitial Ad...";

            try {
                await interstitialAd1.show(); // Triggers the ad
                
                // If ad finishes, kill the boss instantly
                if (bossHp > 0) {
                    bossHp = 0;
                    bossHpEl.innerText = "INSTANT KILLED!";
                    attackBtn.disabled = true;
                    attackBtn.innerText = "Respawning...";
                    setTimeout(resetBoss, 3000);
                    
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                }
                
            } catch (e) {
                console.log("No ad:", e.reason);
                tg.showAlert("Ad could not be shown: " + e.reason);
            } finally {
                interstitialBtn.disabled = false;
                loadingEl.style.display = 'none';
            }
        });

        // Tell Telegram the app is ready
        tg.ready();
    </script>
</body>
</html>
